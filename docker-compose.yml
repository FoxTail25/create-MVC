version: '3.8'

services:
  # Контейнер с PHP
  php-fpm:
    image: php:8.2-fpm
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html

  # Контейнер с веб-сервером Nginx
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80" # Сайт будет доступен по адресу http://localhost:8080
    volumes:
      - .:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
